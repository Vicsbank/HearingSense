<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuitarMood - Analysis</title>
    <style>
        /* --- Basic Styles and Background --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        /* --- Navigation Bar --- */
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1rem 2rem;
            z-index: 1000;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .logo::before {
            content: "🎸";
            font-size: 2rem;
        }

        /* --- Main App Container --- */
        .app-container {
            display: flex;
            gap: 2rem;
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .left-panel, .right-panel {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 2rem;
        }

        /* --- Left: Upload Area --- */
        .upload-box h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .upload-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .file-drop-area {
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .file-drop-area.dragover {
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }

        .file-input {
            display: none;
        }

        .file-msg {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .analyze-button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            color: white;
            padding: 1rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(238, 90, 82, 0.3);
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .analyze-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(238, 90, 82, 0.4);
        }
        .analyze-button:disabled {
            background: grey;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* --- Right: Results Output --- */
        .results-box h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        #results-content {
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
        }

        /* Result Styles */
        .emotion-chart {
            width: 100%;
            max-height: 300px;
            margin-bottom: 1rem;
        }

        .result-section {
            width: 100%;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .result-section h3 {
            color: #4facfe;
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .prediction-list {
            list-style: none;
            padding: 0;
        }

        .prediction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .prediction-item:last-child {
            border-bottom: none;
        }

        .emotion-label, .genre-label {
            font-weight: bold;
            color: white;
        }

        .probability {
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .file-info {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .file-details {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .file-name {
            font-weight: bold;
            color: #4facfe;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .file-name:hover {
            color: #00f2fe;
        }

        .file-meta {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .file-type {
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .error-message {
            color: #ff6b6b;
            font-weight: bold;
            text-align: center;
            padding: 1rem;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .success-message {
            color: #4CAF50;
            font-weight: bold;
            text-align: center;
            padding: 1rem;
            background: rgba(76, 175, 80, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(76, 175, 80, 0.3);
            margin-bottom: 1rem;
        }

        /* Loading Animation */
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Toast Notification Styles */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 3000;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.error {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            box-shadow: 0 4px 15px rgba(238, 90, 82, 0.3);
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            
            .prediction-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .file-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">GuitarMood</a>
        </div>
    </nav>

    <div class="app-container">
        <div class="left-panel">
            <div class="upload-box">
                <h2>Upload Your Music</h2>
                <form id="upload-form" class="upload-form">
                    <div id="file-drop-area" class="file-drop-area">
                        <input type="file" id="file-input" class="file-input" accept="audio/mp3, audio/wav, audio/flac, audio/m4a, audio/aac">
                        <p class="file-msg">Drag & Drop your audio file here, or click to select.</p>
                    </div>
                    <button type="submit" id="analyze-button" class="analyze-button" disabled>Analyze</button>
                </form>
            </div>
        </div>

        <div class="right-panel">
            <div class="results-box">
                <h2>Analysis Results</h2>
                <div id="results-content">
                    <p>Results will be displayed here once the analysis is complete.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('upload-form');
            const fileInput = document.getElementById('file-input');
            const dropArea = document.getElementById('file-drop-area');
            const fileMsg = document.querySelector('.file-msg');
            const analyzeButton = document.getElementById('analyze-button');
            const resultsContent = document.getElementById('results-content');
            let selectedFile = null;

            // --- File Drag-and-Drop Logic ---
            dropArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropArea.classList.add('dragover');
            });

            dropArea.addEventListener('dragleave', () => {
                dropArea.classList.remove('dragover');
            });

            dropArea.addEventListener('drop', (e) => {
                e.preventDefault();
                dropArea.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length) {
                    handleFile(files[0]);
                }
            });
            
            dropArea.addEventListener('click', () => {
                fileInput.click();
            });

            fileInput.addEventListener('change', () => {
                if (fileInput.files.length) {
                    handleFile(fileInput.files[0]);
                }
            });

            function handleFile(file) {
                const allowedTypes = ['audio/mpeg', 'audio/wav', 'audio/flac', 'audio/mp4', 'audio/aac'];
                const allowedExtensions = ['.mp3', '.wav', '.flac', '.m4a', '.aac'];
                
                const fileExtension = file.name.toLowerCase().substring(file.name.lastIndexOf('.'));
                
                if (allowedTypes.includes(file.type) || allowedExtensions.includes(fileExtension)) {
                    selectedFile = file;
                    fileMsg.textContent = `File selected: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
                    analyzeButton.disabled = false;
                } else {
                    selectedFile = null;
                    fileMsg.textContent = 'Invalid file type. Please select MP3, WAV, FLAC, M4A, or AAC files.';
                    analyzeButton.disabled = true;
                }
            }
            
            // --- Form Submission Logic ---
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!selectedFile) return;

                // 1. Show Loading State
                showLoading();
                analyzeButton.disabled = true;
                analyzeButton.textContent = 'Processing...';

                // 2. Prepare Form Data
                const formData = new FormData();
                formData.append('file', selectedFile);

                try {
                    // 3. Send Request to Backend
                    const response = await fetch('/uploadfile/', {
                        method: 'POST',
                        body: formData,
                    });

                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.detail || 'Analysis failed');
                    }
                    
                    // 4. Display Results
                    displayResults(data);

                } catch (error) {
                    // 5. Display Error
                    displayError(error.message);
                } finally {
                    // Reset Button State
                    analyzeButton.disabled = false;
                    analyzeButton.textContent = 'Analyze';
                }
            });

            function showLoading() {
                resultsContent.innerHTML = `
                    <div class="loader"></div>
                    <p>Analyzing audio...</p>
                    <p style="font-size: 0.9rem; opacity: 0.7;">This may take a moment, please wait.</p>
                `;
            }

            function displayError(message) {
                resultsContent.innerHTML = `<div class="error-message">Error: ${message}</div>`;
            }
            
            function displayResults(data) {
                // Clear Results Area
                resultsContent.innerHTML = '';
                
                // Check if Response is Successful
                if (!data.success) {
                    displayError(data.error || 'Analysis failed');
                    return;
                }

                // Display Success Message
                const successDiv = document.createElement('div');
                successDiv.className = 'success-message';
                successDiv.textContent = '✅ Analysis completed successfully!';
                resultsContent.appendChild(successDiv);

                // Display File Information (Uploaded Audio)
                const fileInfoDiv = document.createElement('div');
                fileInfoDiv.className = 'result-section';
                fileInfoDiv.innerHTML = '<h3>📁 File Information</h3>';
                
                const fileInfoContainer = document.createElement('div');
                fileInfoContainer.className = 'file-info';
                
                // Uploaded File Info
                if (data.filename) {
                    const uploadedFileItem = document.createElement('div');
                    uploadedFileItem.className = 'file-item';
                    uploadedFileItem.innerHTML = `
                        <div class="file-details">
                            <div class="file-name" onclick="openFile('${data.filename}', 'uploaded')">
                                <span>📤</span>
                                <span>${data.filename}</span>
                            </div>
                            <div class="file-meta">Original Upload • ${(data.file_size / 1024 / 1024).toFixed(2)} MB</div>
                        </div>
                        <div class="file-type">Input</div>
                    `;
                    fileInfoContainer.appendChild(uploadedFileItem);
                }
                
                fileInfoDiv.appendChild(fileInfoContainer);
                resultsContent.appendChild(fileInfoDiv);

                // Display Emotion Prediction Results
                if (data.predictions && data.predictions.emotion) {
                    const emotionDiv = document.createElement('div');
                    emotionDiv.className = 'result-section';
                    emotionDiv.innerHTML = '<h3>🎭 Emotion Analysis (Top 3)</h3>';
                    
                    const emotionList = document.createElement('ul');
                    emotionList.className = 'prediction-list';
                    
                    for (let i = 0; i < data.predictions.emotion.top3_labels.length; i++) {
                        const item = document.createElement('li');
                        item.className = 'prediction-item';
                        item.innerHTML = `
                            <span class="emotion-label">${data.predictions.emotion.top3_labels[i]}</span>
                            <span class="probability">${(data.predictions.emotion.top3_probabilities[i] * 100).toFixed(1)}%</span>
                        `;
                        emotionList.appendChild(item);
                    }
                    
                    emotionDiv.appendChild(emotionList);
                    resultsContent.appendChild(emotionDiv);

                    // Create Emotion Chart
                    createEmotionChart(data.predictions.emotion);
                }

                // Display Genre Prediction Result
                if (data.predictions && data.predictions.genre) {
                    const genreDiv = document.createElement('div');
                    genreDiv.className = 'result-section';
                    genreDiv.innerHTML = '<h3>🎶 Genre Prediction</h3>';
                    
                    const genreItem = document.createElement('div');
                    genreItem.className = 'prediction-item';
                    genreItem.innerHTML = `
                        <span class="genre-label">${data.predictions.genre.label}</span>
                        <span class="probability">${(data.predictions.genre.probability * 100).toFixed(1)}%</span>
                    `;
                    
                    genreDiv.appendChild(genreItem);
                    resultsContent.appendChild(genreDiv);
                }
            }

            function createEmotionChart(emotionData) {
                // Create Chart Container
                const chartContainer = document.createElement('div');
                chartContainer.className = 'result-section';
                chartContainer.innerHTML = '<h3>📊 Emotion Distribution</h3>';
                
                const canvas = document.createElement('canvas');
                canvas.className = 'emotion-chart';
                chartContainer.appendChild(canvas);
                
                resultsContent.appendChild(chartContainer);

                // Create Chart
                new Chart(canvas, {
                    type: 'bar',
                    data: {
                        labels: emotionData.top3_labels,
                        datasets: [{
                            label: 'Confidence',
                            data: emotionData.top3_probabilities.map(p => (p * 100).toFixed(1)),
                            backgroundColor: [
                                'rgba(255, 99, 132, 0.8)',
                                'rgba(54, 162, 235, 0.8)',
                                'rgba(255, 205, 86, 0.8)'
                            ],
                            borderColor: [
                                'rgba(255, 99, 132, 1)',
                                'rgba(54, 162, 235, 1)',
                                'rgba(255, 205, 86, 1)'
                            ],
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 100,
                                ticks: {
                                    color: 'rgba(255, 255, 255, 0.8)',
                                    callback: function(value) {
                                        return value + '%';
                                    }
                                },
                                grid: {
                                    color: 'rgba(255, 255, 255, 0.1)'
                                }
                            },
                            x: {
                                ticks: {
                                    color: 'rgba(255, 255, 255, 0.8)',
                                    maxRotation: 45
                                },
                                grid: {
                                    color: 'rgba(255, 255, 255, 0.1)'
                                }
                            }
                        }
                    }
                });
            }

            // Global Function: Open File
            window.openFile = function(filePath, fileType, fileName = null) {
                try {
                    if (fileType === 'uploaded') {
                        // For Uploaded Files, Provide Info (Cannot Open Locally)
                        showToast('📤 This is the file you uploaded for analysis', 'info');
                    }
                } catch (error) {
                    showToast('❌ Unable to open file: ' + error.message, 'error');
                }
            };

            // Show Toast Notification
            function showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast ${type === 'error' ? 'error' : ''}`;
                toast.textContent = message;
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.classList.add('show');
                }, 100);
                
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => {
                        if (toast.parentNode) {
                            toast.parentNode.removeChild(toast);
                        }
                    }, 300);
                }, 3000);
            }
        });
    </script>
</body>
</html>
